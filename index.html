<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGC NET · Combo Test Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/quiz-style.css">
</head>
<body>
<header>
  <div class="brand">UGC NET · Combo Test Series<small>10 tests · Paper 1 &amp; Paper 2</small></div>
</header>
<main>
  <h1>Choose a test</h1>
  <div class="sub">Each test has Paper 1 (50 Q · 60 min), Paper 2 (100 Q · 120 min) and a full mock (150 Q · 3 h). 2 marks per question, no negative marking. Open a test and pick <b>Revise</b> to see every answer with its explanation.</div>
  <div id="grid" class="test-grid"></div>
</main>
<script src="assets/tests-manifest.js"></script>
<script>
  const last = JSON.parse(localStorage.getItem('combo_last') || '{}');
  const grid = document.getElementById('grid');
  const groups = {};
  TESTS_MANIFEST.forEach(t => (groups[t.category] = groups[t.category] || []).push(t));
  Object.keys(groups).sort().forEach(cat => {
    const card = document.createElement('div');
    card.className = 'test-card';
    card.innerHTML = `<h3>${cat.replace('Combo Test 0', 'Combo Test ')}</h3>`;
    groups[cat].forEach(t => {
      const r = last[t.slug];
      const status = r ? `Last: ${r.correct}/${r.total} · ${r.marks} marks` : `${t.questions} q · ${t.minutes} min`;
      const a = document.createElement('a');
      a.href = `player.html?test=${encodeURIComponent(t.slug)}`;
      a.innerHTML = `<span>${t.title.split(' · ')[1]}</span><span class="meta">${status}</span>`;
      card.appendChild(a);
    });
    grid.appendChild(card);
  });
</script>
</body>
</html>
